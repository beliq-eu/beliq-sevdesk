name: Docker

# Builds and pushes the worker image to GHCR on a version tag (same v*.*.* tags
# that publish to npm), or on manual dispatch. The image carries only the
# compiled worker plus @beliq/sdk from the public registry; no private beliq
# source is in the build context (see Dockerfile).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# One release at a time, never cancelled midway: two tags pushed together would
# otherwise publish in parallel and finish in either order. GitHub keeps one
# waiting run per group, so a third tag cancels the waiting one; re-run it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/beliq-eu/beliq-sevdesk
  # Built, scanned and pushed from this one list, so no platform is pushed
  # without being scanned.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the guard below needs main's history

      # workflow_dispatch offers every branch, and a tag can point at any commit.
      # This stops a release from the wrong place by mistake. It is no defence
      # against an edit to this file: a tag runs the workflow as of its commit.
      - name: Release only from a vX.Y.Z tag on main
        run: |
          if ! [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::a release runs from a vX.Y.Z tag, not from $GITHUB_REF"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $(git rev-parse --short HEAD), which is not on main"
            exit 1
          fi

      # Gate the image on the same checks as CI, so a tag whose tests fail never
      # produces a published image.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # No dependency cache in a publishing job: a poisoned cache would ship.
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Em-dash scrub check
        run: npm run scrub:check

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: package.json version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./package.json').version")"
          test "$want" = "$have" || {
            echo "tag says $want, package.json says $have"
            exit 1
          }

      # A pushed tag cannot be recalled from the hosts that pulled it, so each
      # platform is built and scanned before anything is pushed. Trivy reads an
      # OCI layout directory, not an OCI tarball, hence tar=false. No
      # attestations here, so each layout holds the one image the scan reads.
      - name: Build each platform for the scan
        run: |
          for platform in ${PLATFORMS//,/ }; do
            docker buildx build --platform "$platform" \
              --provenance=false --sbom=false \
              --output "type=oci,tar=false,dest=$RUNNER_TEMP/scan/${platform//\//-}" .
          done

      # Fails on a CRITICAL vulnerability that has a fixed version and that
      # .trivyignore does not name. One with no fixed version does not block:
      # no rebuild could clear it. Trivy reads the image's Debian packages and
      # its npm packages; it reports nothing for the node binary the base
      # installs, so a CVE in Node.js itself does not block here. Every
      # platform is scanned before the step fails, so the log lists every
      # finding. Findings exit 3, which reads apart from a Trivy error (exit 1).
      # Trivy runs from its container image, pinned by digest like the
      # Dockerfile's bases; bump the tag and the digest together, by hand.
      - name: Scan each platform for fixable CRITICAL vulnerabilities
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.71.1@sha256:53570e6911c2361ebe7995228088cf83a6b9b73e7f3cdca44bd8f8f425e80fa7
        run: |
          status=0
          for platform in ${PLATFORMS//,/ }; do
            rc=0
            docker run --rm \
              -v "$RUNNER_TEMP/scan:/scan:ro" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              -v "$GITHUB_WORKSPACE/.trivyignore:/cfg/.trivyignore:ro" \
              "$TRIVY_IMAGE" image \
              --input "/scan/${platform//\//-}" \
              --severity CRITICAL \
              --ignore-unfixed \
              --ignorefile /cfg/.trivyignore \
              --scanners vuln \
              --exit-code 3 \
              --no-progress \
              || rc=$?
            case $rc in
              0) ;;
              3) echo "::error::$platform: a fixable CRITICAL vulnerability, listed above"; status=1 ;;
              *) echo "::error::$platform: the scan did not finish (exit $rc), so nothing was checked"; status=1 ;;
            esac
          done
          exit "$status"

      # Rebuilds from the build cache of the two builds above, so the layers it
      # pushes are the ones scanned. Keep its build inputs equal to theirs.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}