name: Release

# Publishes beliq-sevdesk to npm via Trusted Publishing (OIDC) - no NPM_TOKEN
# needed. Provenance attestations are generated automatically. Trigger by
# pushing a version tag (e.g. v0.1.0) or running the workflow manually.
#
# Prerequisite: @beliq/sdk must already be on npm, since this package depends on
# it and CI resolves it from the registry.
#
# One-time setup on npmjs.com: configure beliq-eu/beliq-sevdesk as a Trusted
# Publisher for the beliq-sevdesk package (package Settings -> Publishing access
# -> GitHub Actions, workflow `release.yml`, environment `release`). The first
# v0.1.0 release is bootstrapped with a local `npm publish`; every tag from then
# on flows through here with provenance.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# One release at a time, never cancelled midway: two tags pushed together would
# otherwise publish in parallel and finish in either order. GitHub keeps one
# waiting run per group, so a third tag cancels the waiting one; re-run it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest # Trusted Publishing requires a cloud-hosted runner
    timeout-minutes: 15
    # The half an edit to this file cannot remove. GitHub refuses to start the
    # job unless the ref matches this environment's `v*.*.*` tag policy, and
    # npm only accepts a Trusted Publishing token from a run in it.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the guard below needs main's history

      # workflow_dispatch offers every branch, and a tag can point at any commit.
      # This stops a release from the wrong place by mistake. It is no defence
      # against an edit to this file: a tag runs the workflow as of its commit.
      # The `release` environment above is that defence.
      - name: Release only from a vX.Y.Z tag on main
        run: |
          if ! [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::a release runs from a vX.Y.Z tag, not from $GITHUB_REF"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $(git rev-parse --short HEAD), which is not on main"
            exit 1
          fi

      # No `registry-url`: it writes an `.npmrc` with a token placeholder that
      # npm would use instead of OIDC, so publish would fail with a 404. npm
      # defaults to registry.npmjs.org and uses Trusted Publishing when the
      # token-auth `.npmrc` is absent.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      # Trusted Publishing + automatic provenance need npm >= 11.5.1. Pinned, not
      # @latest, so a new npm release reaches a publish only through a reviewed bump.
      - name: Upgrade npm
        # renovate: datasource=npm depName=npm
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Em-dash scrub check
        run: npm run scrub:check

      - name: package.json version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./package.json').version")"
          test "$want" = "$have" || {
            echo "tag says $want, package.json says $have"
            exit 1
          }

      - name: Publish to npm
        run: npm publish